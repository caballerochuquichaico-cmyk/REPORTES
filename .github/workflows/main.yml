name: Compilar EXE (Windows)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name IAPAY_Atencion_Comercio app.py
      - uses: actions/upload-artifact@v4
        with:
          name: IAPAY_Atencion_Comercio_exe
          path: dist/IAPAY_Atencion_Comercio.exe
